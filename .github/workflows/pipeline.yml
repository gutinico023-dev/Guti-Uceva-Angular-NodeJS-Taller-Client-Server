name: Deploy Angular to GitHub Pages

on:
  push:
    branches: ["develop"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: Client-Angular/package-lock.json
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Install dependencies
        working-directory: Client-Angular
        run: npm ci
      - name: Run Unit Tests
        working-directory: Client-Angular
        run: npm test -- --runInBand
      - name: Build Angular
        working-directory: Client-Angular
        run: npm run build -- --base-href "/${{ github.event.repository.name }}/"
      - name: Configure GitHub Pages fallback
        run: cp ./Client-Angular/dist/Angular-Standalone-Template/browser/index.html ./Client-Angular/dist/Angular-Standalone-Template/browser/404.html
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./Client-Angular/dist/Angular-Standalone-Template/browser

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
